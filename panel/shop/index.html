<!DOCTYPE html>
<html lang="fr" dir="ltr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MINIADMIN | MENU</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #121212 !important;
            color: #ffffff !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        
        .bg-dark-header { background-color: #000000; }
        .bg-green-header { background-color: #0f5132; } 
        .bg-green-section { background-color: #198754; }
        
        .menu-btn {
            background-color: #1e1e1e;
            border: 1px solid #333333;
            color: #ffffff;
            width: 100%;
            text-align: left;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s;
        }
        
        .menu-btn:hover, .menu-btn:active {
            background-color: #2a2a2a;
            border-color: #444;
        }

        .form-input {
            background-color: #1e1e1e;
            border: 1px solid #333;
            color: white;
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            outline: none;
        }
        .form-input:focus {
            border-color: #198754;
        }
        
        .action-btn {
            background-color: #ffc107; 
            color: #000;
            font-weight: bold;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: none;
            margin-top: 10px;
        }

        ::-webkit-scrollbar { display: none; }
        
        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            width: 90%;
            max-width: 400px;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <div id="toast-container" class="flex flex-col gap-2"></div>

    <div class="bg-dark-header text-white px-4 py-3 flex items-center gap-3 font-bold text-lg border-b border-gray-800">
        <button id="back-btn" class="hidden" onclick="showView('menu-view')">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <span id="header-title"><i class="fa-solid fa-chevron-left mr-2"></i> MINIADMIN | MENU</span>
    </div>

    <div class="bg-green-header text-white px-4 py-3 flex justify-between items-center shadow-md">
        <div>
            <div class="font-bold uppercase tracking-wide" id="shop-username-display">SHOP_NAME (ID: ---)</div>
            <div class="font-bold mt-1" id="shop-balance-display">0.00 TND</div>
        </div>
        <button class="text-white text-2xl hover:text-gray-300 transition" onclick="showView('menu-view')">
            <i class="fa-solid fa-house"></i>
        </button>
    </div>

    <div class="flex-1 overflow-y-auto pb-6" id="main-container">

        <div id="menu-view" class="p-3 animate-fade-in">
            
            <div class="text-gray-400 text-sm mb-2 mt-2 px-1">Enregistreuse</div>
            <button class="menu-btn" onclick="showView('new-user-view')">Nouvel Utilisateur</button>
            <button class="menu-btn" onclick="fetchAndShowBalances()">Solde des cartes utilisateur</button>
            <button class="menu-btn" onclick="fetchAndShowTransactions()">Transactions utilisateur</button>
            <button class="menu-btn" onclick="fetchAndShowNetHistory()">Historique Net des Joueurs</button>
            <button class="menu-btn" onclick="fetchAndShowTree()">Arbre</button>

            <div class="text-gray-400 text-sm mb-2 mt-4 px-1">Les partenaires</div>
            <button class="menu-btn" onclick="fetchAndShowSportTickets()">Historique des transactions (Sport)</button>
             <button class="menu-btn" onclick="fetchAndShowCasinoHistory()">Historique des transactions (Casino)</button>

        </div>

        <div id="menu-footer" class="animate-fade-in">
            <div class="bg-green-section text-white px-4 py-2 font-bold mb-3">Autre</div>
            <div class="px-3">
                <button class="menu-btn" onclick="changeLanguage('en')">Changer de Langue <i class="fa-regular fa-flag text-gray-400"></i></button>
                <button class="menu-btn" onclick="showView('password-view')">Changer le mot de passe <i class="fa-solid fa-lock text-gray-400"></i></button>
                <button class="menu-btn" onclick="logoutShop()">Me deconnecter <i class="fa-solid fa-arrow-right-from-bracket text-gray-400"></i></button>
            </div>
        </div>

        <div id="new-user-view" class="p-4 hidden animate-fade-in">
            <div class="mb-4">
                <label class="block text-gray-400 text-sm mb-1">Nom d'utilisateur</label>
                <input type="text" id="new-username" class="form-input" placeholder="Nom d'utilisateur">
            </div>
            
            <div class="mb-4 relative">
                <label class="block text-gray-400 text-sm mb-1">Mot de passe</label>
                <input type="password" id="new-password" class="form-input" placeholder="Mot de passe">
                <button class="absolute right-3 top-8 text-gray-400" onclick="togglePassword('new-password')">
                    <i class="fa-regular fa-eye-slash"></i>
                </button>
            </div>
            
            <button class="w-full bg-[#2a2a2a] text-white border border-gray-600 py-2 rounded mb-4" onclick="generatePassword()">Générer un mot de passe</button>

            <div class="mb-4 border-t border-gray-800 pt-4 mt-2">
                <label class="block text-white font-bold mb-2">Équilibre</label>
                <div class="flex items-center">
                    <span class="text-gray-400 mr-2">Total:</span>
                    <input type="number" id="new-balance" class="form-input mb-0 bg-transparent border-b border-t-0 border-l-0 border-r-0 rounded-none focus:border-green-500" value="0.00" step="0.10">
                </div>
            </div>

            <button class="action-btn" id="btn-create-user" onclick="createPlayerAccount()">Créer</button>
        </div>

        <div id="balances-view" class="p-3 hidden animate-fade-in">
            <div class="flex gap-2 mb-3">
                <div class="relative w-full">
                    <i class="fa-solid fa-search absolute left-3 top-3 text-gray-400"></i>
                    <input type="text" id="search-users" oninput="filterTable('users-table', this.value)" class="form-input pl-10 mb-0" placeholder="Search">
                </div>
                <button class="bg-yellow-400 text-black font-bold px-4 rounded" onclick="fetchAndShowBalances()">Search</button>
            </div>

            <div class="flex justify-between bg-[#0f5132] text-white px-3 py-2 rounded-t font-bold text-sm">
                <span>Carte d'utilisateur</span>
                <span>Solde du Compte</span>
            </div>

            <div class="bg-[#1e1e1e] border border-gray-800 rounded-b p-2">
                <div class="flex justify-between text-gray-300 text-sm mb-2 border-b border-gray-700 pb-2">
                    <span><span id="users-count">0</span> Utilisateur</span>
                    <span id="total-users-balance" class="font-bold text-white">0.00</span>
                </div>
                
                <table class="w-full text-left text-sm" id="users-table">
                    <thead class="text-gray-400 border-b border-gray-700">
                        <tr>
                            <th class="py-2 font-normal">Id</th>
                            <th class="py-2 font-normal">Nom d'utilisateur</th>
                            <th class="py-2 font-normal text-right">Solde du Compte</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody">
                    </tbody>
                </table>
            </div>
        </div>

        <div id="tree-view" class="p-3 hidden animate-fade-in">
            <div class="mb-3">
                <label class="block text-gray-400 text-sm mb-1">Nom d'utilisateur</label>
                <input type="text" id="tree-search-username" class="form-input" placeholder="Nom d'utilisateur" oninput="filterTree()">
            </div>
            <div class="mb-3">
                <label class="block text-gray-400 text-sm mb-1">Id</label>
                <input type="text" id="tree-search-id" class="form-input" placeholder="Id" oninput="filterTree()">
            </div>
            <div class="mb-3">
                <label class="block text-gray-400 text-sm mb-1">Rôle</label>
                <select class="form-input" id="tree-role" onchange="filterTree()">
                    <option value="all">Rôle</option>
                    <option value="player">Player</option>
                </select>
            </div>
            <button class="action-btn mb-4" onclick="fetchAndShowTree()">Afficher</button>

            <div id="tree-list" class="flex flex-col gap-2">
            </div>
        </div>
        
        <div id="transactions-view" class="p-3 hidden animate-fade-in">
             <div class="mb-3">
                <label class="block text-gray-400 text-sm mb-1">Nom d'utilisateur</label>
                <input type="text" id="trans-search-username" class="form-input" placeholder="Nom d'utilisateur" oninput="filterTransactions()">
            </div>
             <button class="action-btn mb-4" onclick="fetchAndShowTransactions()">Afficher</button>
             <div id="transactions-list" class="flex flex-col gap-2">
            </div>
        </div>
        
         <div id="net-history-view" class="p-3 hidden animate-fade-in">
             <div class="mb-3">
                <label class="block text-gray-400 text-sm mb-1">Nom d'utilisateur</label>
                <input type="text" id="net-search-username" class="form-input" placeholder="Nom d'utilisateur" oninput="filterNetHistory()">
            </div>
             <button class="action-btn mb-4" onclick="fetchAndShowNetHistory()">Afficher</button>
             <div id="net-history-list" class="flex flex-col gap-2">
            </div>
        </div>

        <div id="sport-history-view" class="p-3 hidden animate-fade-in">
             <div class="mb-3">
                <label class="block text-gray-400 text-sm mb-1">Nom d'utilisateur</label>
                <input type="text" id="sport-search-username" class="form-input" placeholder="Nom d'utilisateur" oninput="filterSportHistory()">
            </div>
             <button class="action-btn mb-4" onclick="fetchAndShowSportTickets()">Afficher</button>
             <div id="sport-history-list" class="flex flex-col gap-2">
            </div>
        </div>

        <div id="casino-history-view" class="p-3 hidden animate-fade-in">
             <div class="mb-3">
                <label class="block text-gray-400 text-sm mb-1">Nom d'utilisateur</label>
                <input type="text" id="casino-search-username" class="form-input" placeholder="Nom d'utilisateur" oninput="filterCasinoHistory()">
            </div>
             <button class="action-btn mb-4" onclick="fetchAndShowCasinoHistory()">Afficher</button>
             <div id="casino-history-list" class="flex flex-col gap-2">
            </div>
        </div>

        <div id="password-view" class="p-4 hidden animate-fade-in">
             <div class="mb-4 relative">
                <label class="block text-gray-400 text-sm mb-1">Entrez un nouveau mot de passe</label>
                <input type="password" id="new-shop-pass" class="form-input" placeholder="Entrez un nouveau mot de passe">
            </div>
            <button class="action-btn" onclick="updateShopPassword()">Sauvegarder</button>
        </div>

    </div>

    <div id="balance-modal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-[#1e1e1e] border border-gray-700 rounded-lg w-full max-w-sm p-4">
            <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
                <h3 class="text-white font-bold">Gérer le solde</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <div class="text-center mb-4">
                <div class="text-gray-400 text-sm">Joueur</div>
                <div class="text-[#0ea5e9] font-mono font-bold text-lg" id="modal-username">---</div>
            </div>

            <input type="number" id="modal-amount" class="form-input text-center text-lg font-bold" placeholder="Montant (TND)">
             
            <div class="mb-4 relative mt-2">
                <label class="block text-gray-400 text-sm mb-1">Nouveau mot de passe (Optionnel)</label>
                <input type="password" id="modal-new-pass" class="form-input" placeholder="Nouveau mot de passe">
                 <button class="absolute right-3 top-8 text-gray-400" onclick="togglePassword('modal-new-pass')">
                    <i class="fa-regular fa-eye-slash"></i>
                </button>
                <button onclick="changePlayerPasswordFromModal()" class="w-full bg-[#2a2a2a] text-white border border-gray-600 py-1 rounded mt-1 text-sm">Changer MDP</button>
            </div>

            <div class="flex gap-2 mt-4">
                <button onclick="processTransaction('charge')" class="flex-1 bg-green-600 text-white font-bold py-3 rounded">Dépôt</button>
                <button onclick="processTransaction('withdraw')" class="flex-1 bg-red-600 text-white font-bold py-3 rounded">Retrait</button>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://alpha-backend-server.onrender.com";
        const token = localStorage.getItem('token');
        let sessionData = localStorage.getItem('alpha_user');
        let user = sessionData ? JSON.parse(sessionData) : null;

        if (!token || !user || user.role !== 'shop') {
            localStorage.clear();
            window.location.href = '/';
        }

        let allUsersCache = [];
        let createdPlayersList = [];
        let selectedPlayer = "";
        let allTransactionsCache = [];
        let allSportTicketsCache = [];
        let allCasinoHistoryCache = [];

        function showNotification(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-green-600' : 'bg-red-600';
            
            toast.className = `${bgColor} text-white px-4 py-3 rounded shadow-lg flex items-center justify-between transition-all duration-300 transform translate-y-0 opacity-100 mb-2`;
            toast.innerHTML = `<span class="text-sm font-bold">${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('shop-username-display').innerText = `${user.username.toUpperCase()} (ID: ${user.id || '---'})`;
            updateTopBalance(user.balance);
            await loadShopPlayersData();
        });

        function updateTopBalance(balance) {
            const balNum = parseFloat(balance || 0).toFixed(2);
            document.getElementById('shop-balance-display').innerText = `${balNum} TND`;
        }

        function getAuthHeaders() {
            return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
        }

        function showView(viewId) {
            const views = ['menu-view', 'new-user-view', 'balances-view', 'tree-view', 'password-view', 'transactions-view', 'net-history-view', 'sport-history-view', 'casino-history-view'];
            views.forEach(v => {
                document.getElementById(v).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');

            const backBtn = document.getElementById('back-btn');
            const menuFooter = document.getElementById('menu-footer');
            const title = document.getElementById('header-title');

            if (viewId === 'menu-view') {
                backBtn.classList.add('hidden');
                menuFooter.classList.remove('hidden');
                title.innerHTML = '<i class="fa-solid fa-chevron-left mr-2"></i> MINIADMIN | MENU';
            } else {
                backBtn.classList.remove('hidden');
                menuFooter.classList.add('hidden');
                let titleText = viewId.replace('-view', '').replace(/-/g, ' ').toUpperCase();
                if(viewId === 'balances-view') titleText = 'SOLDE DES CARTES';
                if(viewId === 'new-user-view') titleText = 'NOUVEL UTILISATEUR';
                title.innerHTML = titleText;
            }
        }

        function generatePassword() {
            const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let pass = "";
            for (let i = 0; i < 8; i++) pass += chars.charAt(Math.floor(Math.random() * chars.length));
            document.getElementById('new-password').value = pass;
        }

        function togglePassword(id) {
            const input = document.getElementById(id);
            input.type = input.type === "password" ? "text" : "password";
        }

        async function loadShopPlayersData() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/users`, { headers: getAuthHeaders() });
                if(res.ok) {
                    allUsersCache = await res.json();
                    createdPlayersList = allUsersCache.filter(u => u.created_by === user.username && u.role === 'player');
                    
                    const me = allUsersCache.find(u => u.username === user.username);
                    if(me) {
                        user.balance = me.balance;
                        updateTopBalance(user.balance);
                        localStorage.setItem('alpha_user', JSON.stringify(user));
                    }
                }
            } catch(e) { console.error(e); }
        }

        async function createPlayerAccount() {
            const username = document.getElementById('new-username').value.trim().toLowerCase();
            const password = document.getElementById('new-password').value;
            const initialBalance = parseFloat(document.getElementById('new-balance').value) || 0;
            const btn = document.getElementById('btn-create-user');

            if (!username || !password) return showNotification("Veuillez remplir les champs", "error");

            btn.innerText = "⏳...";
            btn.disabled = true;

            try {
                const res = await fetch(`${BACKEND_URL}/api/register`, {
                    method: 'POST', headers: getAuthHeaders(),
                    body: JSON.stringify({ username, password, role: 'player', created_by: user.username, phone: "00000000" })
                });
                const data = await res.json();

                if (res.ok) {
                    showNotification("Compte créé avec succès!");
                    
                    if (initialBalance > 0) {
                        await fetch(`${BACKEND_URL}/api/admin/update-balance`, {
                            method: 'POST', headers: getAuthHeaders(),
                            body: JSON.stringify({ admin_username: user.username, target_username: username, action: 'charge', amount: initialBalance })
                        });
                        showNotification(`Solde initial ${initialBalance} TND ajouté`);
                    }

                    document.getElementById('new-username').value = '';
                    document.getElementById('new-password').value = '';
                    document.getElementById('new-balance').value = '0.00';
                    
                    await loadShopPlayersData();
                } else {
                    showNotification(data.detail || "Erreur", "error");
                }
            } catch (e) {
                showNotification("Erreur de connexion", "error");
            } finally {
                btn.innerText = "Créer";
                btn.disabled = false;
            }
        }

        async function fetchAndShowBalances() {
            showView('balances-view');
            await loadShopPlayersData();
            renderUsersTable(createdPlayersList);
        }

        function renderUsersTable(users) {
            const tbody = document.getElementById('users-tbody');
            document.getElementById('users-count').innerText = users.length;
            
            let totalBal = 0;
            let html = '';

            if(users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-gray-500">Aucun joueur</td></tr>';
                document.getElementById('total-users-balance').innerText = "0.00";
                return;
            }

            users.forEach(u => {
                const bal = parseFloat(u.balance || 0);
                totalBal += bal;
                html += `
                <tr class="border-b border-gray-800 hover:bg-gray-800 transition">
                    <td class="py-3 text-gray-400 font-mono text-xs">${u.id || '---'}</td>
                    <td class="py-3 font-bold text-[#0ea5e9]">${escapeHTML(u.username)}</td>
                    <td class="py-3 text-right font-mono font-bold">${bal.toFixed(2)}</td>
                    <td class="py-3 text-right">
                        <button onclick="openBalanceModal('${escapeHTML(u.username)}')" class="text-green-500 text-lg ml-2"><i class="fa-solid fa-circle-plus"></i></button>
                    </td>
                </tr>`;
            });
            
            document.getElementById('total-users-balance').innerText = totalBal.toFixed(2);
            tbody.innerHTML = html;
        }

        function filterTable(tableId, term) {
            const lowerTerm = term.toLowerCase();
            const filtered = createdPlayersList.filter(u => u.username.toLowerCase().includes(lowerTerm));
            renderUsersTable(filtered);
        }

        function openBalanceModal(username) {
            selectedPlayer = username;
            document.getElementById('modal-username').innerText = username;
            document.getElementById('modal-amount').value = '';
            document.getElementById('modal-new-pass').value = '';
            document.getElementById('balance-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('balance-modal').classList.add('hidden');
        }

        async function processTransaction(action) {
            const amount = parseFloat(document.getElementById('modal-amount').value);
            if (!amount || amount <= 0) return showNotification("Montant invalide", "error");
            
            if(action === 'charge' && user.balance < amount) {
                return showNotification('Solde insuffisant!', 'error');
            }

            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/update-balance`, {
                    method: 'POST', headers: getAuthHeaders(),
                    body: JSON.stringify({ admin_username: user.username, target_username: selectedPlayer, action, amount })
                });
                const data = await res.json();
                
                if (res.ok) {
                    showNotification("Opération réussie!");
                    closeModal();
                    await fetchAndShowBalances(); 
                } else {
                    showNotification(data.detail || "Erreur", "error");
                }
            } catch (e) {
                showNotification("Erreur de connexion", "error");
            }
        }

        async function changePlayerPasswordFromModal() {
             const newPassword = document.getElementById('modal-new-pass').value;
             if(!newPassword || newPassword.length < 4) return showNotification('Mot de passe trop court', 'error');
             
             try {
                const res = await fetch(`${BACKEND_URL}/api/admin/change-player-password`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({
                        admin_username: user.username,
                        target_username: selectedPlayer,
                        new_password: newPassword
                    })
                });
                if(res.ok) {
                    showNotification(`Mot de passe modifié avec succès!`);
                    document.getElementById('modal-new-pass').value = '';
                } else {
                    showNotification('Erreur', 'error');
                }
            } catch(e) { showNotification('Erreur de connexion', 'error'); }
        }


        async function fetchAndShowTree() {
            showView('tree-view');
            await loadShopPlayersData();
            renderTree(createdPlayersList);
        }
        
        function renderTree(users) {
            const container = document.getElementById('tree-list');
            if(users.length === 0) {
                 container.innerHTML = '<div class="text-center py-4 text-gray-500">Aucun joueur</div>';
                 return;
            }
             let html = '';
             users.forEach(u => {
                 const bal = parseFloat(u.balance || 0).toFixed(2);
                 html += `
                 <div class="bg-[#1e1e1e] border border-gray-700 rounded p-3 flex justify-between items-center">
                     <div>
                         <div class="font-bold text-lg text-white">${escapeHTML(u.username)}</div>
                         <div class="text-gray-400 text-xs font-mono mt-1">ID: ${u.id || '---'}</div>
                     </div>
                     <div class="text-right">
                         <div class="text-sm text-gray-300">ÉQUILIBRE: <span class="font-mono font-bold text-white">${bal} TND</span></div>
                         <div class="text-gray-400 text-xs mt-1">RÔLE: ${u.role.substring(0,1).toUpperCase()}</div>
                     </div>
                 </div>`;
             });
             container.innerHTML = html;
        }

        function filterTree() {
            const username = document.getElementById('tree-search-username').value.toLowerCase();
            const id = document.getElementById('tree-search-id').value.toLowerCase();
            const role = document.getElementById('tree-role').value;
            
            let filtered = createdPlayersList;
            if(username) filtered = filtered.filter(u => u.username.toLowerCase().includes(username));
            if(id) filtered = filtered.filter(u => (u.id || '').toString().toLowerCase().includes(id));
            if(role !== 'all') filtered = filtered.filter(u => u.role === role);
            
            renderTree(filtered);
        }

        async function fetchAndShowTransactions() {
            showView('transactions-view');
            const container = document.getElementById('transactions-list');
            container.innerHTML = '<div class="text-center py-4 text-gray-500">Chargement...</div>';
            
            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/transactions-history?username=${user.username}`, { headers: getAuthHeaders() });
                if (res.ok) {
                    allTransactionsCache = await res.json();
                    renderTransactions(allTransactionsCache);
                } else { container.innerHTML = '<div class="text-center py-4 text-red-500">Erreur</div>'; }
            } catch (e) { container.innerHTML = '<div class="text-center py-4 text-red-500">Erreur de connexion</div>'; }
        }

        function renderTransactions(txs) {
            const container = document.getElementById('transactions-list');
            if (txs.length === 0) {
                 container.innerHTML = '<div class="text-center py-4 text-gray-500">Aucune transaction</div>';
                 return;
            }
            
            let html = '';
            txs.forEach(t => {
                const isCharge = t.action === 'charge' || t.action === 'deposit_request';
                const color = isCharge ? 'text-green-500' : 'text-red-500';
                const sign = isCharge ? '+' : '-';
                const targetName = escapeHTML(t.target_username || t.target || 'Inconnu');
                const actionName = escapeHTML(t.action);
                
                html += `
                <div class="bg-[#1e1e1e] border border-gray-700 rounded p-3 flex justify-between items-center">
                    <div>
                        <div class="font-bold text-white">👤 ${targetName} <span class="text-gray-400 text-xs">(${actionName})</span></div>
                        <div class="text-gray-400 text-xs font-mono mt-1">🕒 ${t.date || ''}</div>
                    </div>
                    <div class="text-right">
                        <div class="font-mono font-bold ${color}">${sign}${parseFloat(t.amount).toFixed(2)} TND</div>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function filterTransactions() {
             const username = document.getElementById('trans-search-username').value.toLowerCase();
             let filtered = allTransactionsCache;
             if(username) filtered = filtered.filter(t => (t.target_username || '').toLowerCase().includes(username));
             renderTransactions(filtered);
        }

        async function fetchAndShowNetHistory() {
             showView('net-history-view');
             const container = document.getElementById('net-history-list');
             container.innerHTML = '<div class="text-center py-4 text-gray-500">Chargement...</div>';
             
             try {
                const res = await fetch(`${BACKEND_URL}/api/admin/transactions-history?username=${user.username}`, { headers: getAuthHeaders() });
                if (res.ok) {
                    const txs = await res.json();
                    
                    let userStats = {};
                    txs.forEach(t => {
                        const target = t.target_username;
                        if(!target) return;
                        if(!userStats[target]) userStats[target] = { deposit: 0, withdraw: 0 };
                        
                        const amt = parseFloat(t.amount) || 0;
                        if (t.action === 'charge' || t.action === 'deposit_request') userStats[target].deposit += amt;
                        else if (t.action === 'withdraw') userStats[target].withdraw += amt;
                    });
                    
                    let statsArray = [];
                    for(let username in userStats) {
                        statsArray.push({
                            username: username,
                            deposit: userStats[username].deposit,
                            withdraw: userStats[username].withdraw,
                            net: userStats[username].deposit - userStats[username].withdraw
                        });
                    }
                    
                    window._currentNetStats = statsArray;
                    renderNetHistory(statsArray);

                } else { container.innerHTML = '<div class="text-center py-4 text-red-500">Erreur</div>'; }
            } catch (e) { container.innerHTML = '<div class="text-center py-4 text-red-500">Erreur de connexion</div>'; }
        }
        
        function renderNetHistory(stats) {
            const container = document.getElementById('net-history-list');
            if (stats.length === 0) {
                 container.innerHTML = '<div class="text-center py-4 text-gray-500">Aucune donnée</div>';
                 return;
            }
            let html = '';
            stats.forEach(s => {
                const netColor = s.net >= 0 ? 'text-green-500' : 'text-red-500';
                html += `
                <div class="bg-[#1e1e1e] border border-gray-700 rounded p-3">
                     <div class="font-bold text-white mb-2 text-lg border-b border-gray-700 pb-1">👤 ${escapeHTML(s.username)}</div>
                     <div class="flex justify-between text-sm mb-1">
                         <span class="text-gray-400">Dépôt:</span>
                         <span class="text-white font-mono">${s.deposit.toFixed(2)}</span>
                     </div>
                     <div class="flex justify-between text-sm mb-1">
                         <span class="text-gray-400">Retrait:</span>
                         <span class="text-white font-mono">${s.withdraw.toFixed(2)}</span>
                     </div>
                     <div class="flex justify-between text-sm font-bold border-t border-gray-700 pt-1 mt-1">
                         <span class="text-gray-300">Total:</span>
                         <span class="font-mono ${netColor}">${s.net.toFixed(2)}</span>
                     </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function filterNetHistory() {
             const username = document.getElementById('net-search-username').value.toLowerCase();
             let filtered = window._currentNetStats || [];
             if(username) filtered = filtered.filter(s => s.username.toLowerCase().includes(username));
             renderNetHistory(filtered);
        }

        async function fetchAndShowSportTickets() {
            showView('sport-history-view');
            const container = document.getElementById('sport-history-list');
            container.innerHTML = '<div class="text-center py-4 text-gray-500">Chargement...</div>';
            
            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/get-all-tickets?t=${Date.now()}`, { headers: getAuthHeaders() });
                if (res.ok) {
                    const allTickets = await res.json();
                    
                    const shopPlayers = createdPlayersList.map(p => p.username);
                    allSportTicketsCache = allTickets.filter(t => shopPlayers.includes(t.username || t.user));
                    
                    renderSportTickets(allSportTicketsCache);
                } else { container.innerHTML = '<div class="text-center py-4 text-red-500">Erreur</div>'; }
            } catch (e) { container.innerHTML = '<div class="text-center py-4 text-red-500">Erreur de connexion</div>'; }
        }

        function renderSportTickets(tickets) {
             const container = document.getElementById('sport-history-list');
             if (tickets.length === 0) {
                 container.innerHTML = '<div class="text-center py-4 text-gray-500">Aucun ticket en attente</div>';
                 return;
             }
             let html = '';
             tickets.forEach(t => {
                 let badgeColor = t.status === "gagne" ? "text-green-500" : (t.status === "perdu" ? "text-red-500" : (t.status === "cashout" ? "text-yellow-500" : "text-blue-500"));
                 let matchesHtml = Array.isArray(t.details_list) ? t.details_list.map(g => `• ${escapeHTML(g.matchName)} (<span class="text-yellow-500">${escapeHTML(g.outcome)}</span>)`).join('<br>') : escapeHTML(t.match || "Match Inconnu");
                 
                 html += `
                 <div class="bg-[#1e1e1e] border border-gray-700 rounded p-3 text-sm">
                     <div class="flex justify-between items-start mb-2">
                         <div class="text-white">
                             <span class="text-gray-400 font-mono">#${t.ticket_id || t.id || ''}</span><br>
                             👤 <span class="text-[#0ea5e9] font-bold">${t.username || t.user || ''}</span>
                         </div>
                         <span class="border border-gray-600 px-2 py-1 rounded text-xs uppercase ${badgeColor} font-bold">${t.status}</span>
                     </div>
                     <div class="text-gray-300 mb-2 leading-relaxed">${matchesHtml}</div>
                     <div class="border-t border-gray-700 pt-2 flex justify-between font-mono">
                         <div class="text-gray-400">
                             Cote: X${parseFloat(t.total_cote || 0).toFixed(2)}<br>
                             Mise: ${parseFloat(t.mise || 0).toFixed(2)}
                         </div>
                         <div class="${badgeColor} font-bold text-right flex items-end">
                             Gain: +${parseFloat(t.gain || 0).toFixed(2)} TND
                         </div>
                     </div>
                 </div>`;
             });
             container.innerHTML = html;
        }

        function filterSportHistory() {
             const username = document.getElementById('sport-search-username').value.toLowerCase();
             let filtered = allSportTicketsCache;
             if(username) filtered = filtered.filter(t => (t.username || t.user || '').toLowerCase().includes(username));
             renderSportTickets(filtered);
        }

        async function fetchAndShowCasinoHistory() {
            showView('casino-history-view');
            const container = document.getElementById('casino-history-list');
            container.innerHTML = '<div class="text-center py-4 text-gray-500">Chargement...</div>';
            
            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/casino-history`, { headers: getAuthHeaders() });
                if (res.ok) {
                    const allHistory = await res.json();
                    
                    const shopPlayers = createdPlayersList.map(p => p.username);
                    allCasinoHistoryCache = allHistory.filter(t => shopPlayers.includes(t.username));
                    
                    renderCasinoHistory(allCasinoHistoryCache);
                } else { container.innerHTML = '<div class="text-center py-4 text-red-500">Erreur</div>'; }
            } catch (e) { container.innerHTML = '<div class="text-center py-4 text-red-500">Erreur API</div>'; }
        }

        function renderCasinoHistory(history) {
             const container = document.getElementById('casino-history-list');
             if (history.length === 0) {
                 container.innerHTML = '<div class="text-center py-4 text-gray-500">Aucun pari de casino trouvé</div>';
                 return;
             }
             let html = '';
             history.forEach(t => {
                 const isWin = t.action === 'win';
                 const badgeColor = isWin ? 'text-green-500' : 'text-red-500';
                 const sign = isWin ? '+' : '-';
                 const actionName = isWin ? 'Gain' : 'Mise';
                 
                 html += `
                 <div class="bg-[#1e1e1e] border border-gray-700 rounded p-3 flex justify-between items-center text-sm">
                     <div>
                         <div class="text-white font-bold">👤 ${escapeHTML(t.username)}</div>
                         <div class="text-gray-400 font-mono text-xs mt-1">🕒 ${t.date}</div>
                     </div>
                     <div class="text-right">
                         <div class="text-xs text-gray-400 uppercase mb-1">${actionName}</div>
                         <div class="${badgeColor} font-bold font-mono text-lg">${sign}${parseFloat(t.amount).toFixed(2)} TND</div>
                     </div>
                 </div>`;
             });
             container.innerHTML = html;
        }

        function filterCasinoHistory() {
             const username = document.getElementById('casino-search-username').value.toLowerCase();
             let filtered = allCasinoHistoryCache;
             if(username) filtered = filtered.filter(t => (t.username || '').toLowerCase().includes(username));
             renderCasinoHistory(filtered);
        }

        async function updateShopPassword() {
            const newPass = document.getElementById('new-shop-pass').value;
            if (!newPass || newPass.length < 6) return showNotification('6 caractères minimum', 'error');
            
            try {
                const res = await fetch(`${BACKEND_URL}/api/user/change-password`, {
                    method: 'POST', headers: getAuthHeaders(),
                    body: JSON.stringify({ username: user.username, new_password: newPass })
                });
                if (res.ok) {
                    showNotification('Mot de passe mis à jour!', 'success');
                    document.getElementById('new-shop-pass').value = '';
                } else {
                    const data = await res.json();
                    showNotification(data.detail || 'Erreur', 'error');
                }
            } catch (e) { showNotification('Erreur de connexion', 'error'); }
        }

        function changeLanguage(lang) {
           if(lang === 'en') {
                showNotification("English translation not fully implemented yet.", "warning");
           }
        }

        function logoutShop() {
            localStorage.clear();
            window.location.href = '/';
        }

        let idleTime = 0;
        function timerIncrement() {
            idleTime = idleTime + 1;
            if (idleTime > 15) {
                showNotification("Déconnexion pour inactivité", "warning");
                setTimeout(logoutShop, 1500);
            }
        }
        document.body.addEventListener('mousemove', () => idleTime = 0);
        document.body.addEventListener('keypress', () => idleTime = 0);
        setInterval(timerIncrement, 60000); 

        document.addEventListener('contextmenu', event => event.preventDefault());

    </script>
</body>
</html>
