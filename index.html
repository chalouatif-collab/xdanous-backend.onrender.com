<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Core - Premium Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
                input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

                @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
            100% { transform: translateY(0px) scale(1); }
        }
        .animate-float { animation: float 8s ease-in-out infinite; }
        .animate-float-delayed { animation: float 8s ease-in-out 4s infinite; }

                .glass-card {
            background: rgba(11, 16, 31, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8), 0 0 20px rgba(6, 182, 212, 0.1) inset;
        }

                .cyber-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(148, 163, 184, 0.2);
            transition: all 0.3s ease;
        }
        .cyber-input:focus {
            background: rgba(6, 182, 212, 0.05);
            border-color: rgba(6, 182, 212, 0.6);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
        }
    </style>
</head>
<body class="bg-[#030712] text-slate-200 min-h-screen font-sans flex items-center justify-center p-4 relative overflow-hidden">

        <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-cyan-600/20 rounded-full blur-[100px] pointer-events-none animate-float"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[600px] h-[600px] bg-rose-600/10 rounded-full blur-[120px] pointer-events-none animate-float-delayed"></div>

        <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3 w-full max-w-sm px-4 pointer-events-none"></div>

        <main class="w-full max-w-md glass-card rounded-[2rem] p-8 relative z-10">
        
                <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-1 bg-gradient-to-r from-transparent via-cyan-500 to-transparent opacity-50"></div>

        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-cyan-950 to-slate-900 border border-cyan-800/50 shadow-[0_0_20px_rgba(6,182,212,0.3)] mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4" />
                </svg>
            </div>
            <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white via-cyan-100 to-slate-400 tracking-tight">ALPHA <span class="text-cyan-500">BET216</span></h1>
            <p class="text-xs text-cyan-500/80 mt-1 uppercase tracking-[0.2em] font-bold">Secure Gateway</p>
        </div>

                <div id="step-1-login" class="space-y-5 text-sm font-bold transition-all duration-500 opacity-100 transform translate-x-0">
            <div class="space-y-1.5">
                <label class="text-slate-400 block px-1 text-xs uppercase tracking-wider">Identifiant</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </div>
                    <input type="text" id="auth-username" placeholder="Nom d'utilisateur" class="cyber-input w-full pl-11 pr-4 py-3.5 rounded-xl text-white font-mono placeholder-slate-600">
                </div>
            </div>
            
            <div class="space-y-1.5">
                <label class="text-slate-400 block px-1 text-xs uppercase tracking-wider">Mot de passe</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                    </div>
                    <input type="password" id="auth-password" placeholder="••••••••" class="cyber-input w-full pl-11 pr-4 py-3.5 rounded-xl text-white font-mono placeholder-slate-600">
                </div>
            </div>
            
            <button onclick="handleLoginStep1()" id="btn-step-1" class="w-full relative group overflow-hidden rounded-xl p-4 bg-gradient-to-r from-cyan-600 to-blue-600 font-black text-white shadow-[0_0_20px_rgba(6,182,212,0.3)] hover:shadow-[0_0_30px_rgba(6,182,212,0.5)] transition-all mt-4">
                <span class="relative z-10 uppercase tracking-widest text-xs">Authentification</span>
                <div class="absolute inset-0 bg-gradient-to-r from-blue-500 to-cyan-400 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            </button>
        </div>

                <div id="step-2-2fa" class="space-y-5 text-sm font-bold hidden opacity-0 transform translate-x-10 transition-all duration-500">
            <div class="text-center mb-6">
                <p class="text-white text-base font-bold">Vérification en deux étapes</p>
                <p class="text-slate-400 text-xs font-normal mt-1 leading-relaxed">Veuillez saisir le code à 6 chiffres généré par votre application Google Authenticator.</p>
            </div>
            
            <div class="relative group">
                <div class="absolute -inset-0.5 bg-gradient-to-r from-cyan-500 to-emerald-500 rounded-xl blur opacity-30 group-hover:opacity-60 transition duration-1000 group-hover:duration-200"></div>
                <input type="number" id="auth-2fa-code" placeholder="0 0 0 0 0 0" class="relative w-full p-4 rounded-xl bg-[#03050a] border border-slate-700 text-cyan-400 font-mono text-center text-3xl tracking-[0.4em] focus:outline-none focus:border-cyan-500 transition-colors shadow-inner">
            </div>
            
            <button onclick="handleLoginStep2()" id="btn-step-2" class="w-full relative group overflow-hidden rounded-xl p-4 bg-gradient-to-r from-emerald-500 to-teal-500 font-black text-white shadow-[0_0_20px_rgba(16,185,129,0.3)] hover:shadow-[0_0_30px_rgba(16,185,129,0.5)] transition-all mt-2">
                <span class="relative z-10 uppercase tracking-widest text-xs flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    Autoriser l'accès
                </span>
            </button>
            
            <button onclick="resetToStep1()" class="w-full text-slate-500 hover:text-white font-normal mt-2 text-xs flex items-center justify-center gap-1 transition-colors cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Retour
            </button>
        </div>
    </main>

    <script>
        const BACKEND_URL = "https://alpha-backend-server.onrender.com";
        let validUsername = "";

        function showNotification(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const toast = document.createElement('div');
            toast.className = `p-4 rounded-2xl shadow-[0_10px_30px_rgba(0,0,0,0.5)] border backdrop-blur-md text-xs font-bold flex items-center gap-3 transform translate-x-full transition-all duration-300 ${type === 'success' ? 'bg-emerald-950/80 border-emerald-500/50 text-emerald-100' : 'bg-rose-950/80 border-rose-500/50 text-rose-100'}`;
            
            const icon = type === 'success' 
                ? `<svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>` 
                : `<svg class="w-5 h-5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            
            toast.innerHTML = `${icon} <span class="tracking-wide">${message}</span>`;
            container.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.remove('translate-x-full');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-x-4');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function handleLoginStep1() {
            const usernameInput = document.getElementById('auth-username').value.trim();
            const passwordInput = document.getElementById('auth-password').value;
            const btn = document.getElementById('btn-step-1');
            const btnText = btn.querySelector('span');
            
            if(!usernameInput || !passwordInput) return showNotification('Veuillez remplir tous les champs', 'error');

            btn.disabled = true;
            btnText.innerHTML = '<svg class="animate-spin h-4 w-4 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';

            try {
                const res = await fetch(`${BACKEND_URL}/api/login`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ username: usernameInput, password: passwordInput }) 
                });
                
                const data = await res.json();
                
                if (!res.ok) {
                    btn.disabled = false;
                    btnText.innerHTML = 'Authentification';
                    return showNotification(data.detail || 'Identifiants incorrects', 'error');
                }
                
                validUsername = data.username;
                
                const step1 = document.getElementById('step-1-login');
                const step2 = document.getElementById('step-2-2fa');
                
                step1.classList.remove('translate-x-0', 'opacity-100');
                step1.classList.add('-translate-x-10', 'opacity-0');
                
                setTimeout(() => {
                    step1.classList.add('hidden');
                    step2.classList.remove('hidden');
                    
                    void step2.offsetWidth;
                    
                    step2.classList.remove('translate-x-10', 'opacity-0');
                    step2.classList.add('translate-x-0', 'opacity-100');
                    
                    setTimeout(() => document.getElementById('auth-2fa-code').focus(), 100);
                }, 400);

            } catch(e){ 
                btn.disabled = false;
                btnText.innerHTML = 'Authentification';
                showNotification('Erreur réseau. Serveur injoignable.', 'error'); 
            }
        }

        async function handleLoginStep2() {
            const codeInput = document.getElementById('auth-2fa-code').value.trim();
            const btn = document.getElementById('btn-step-2');
            const btnText = btn.querySelector('span');

            if(!codeInput || codeInput.length < 6) return showNotification('Code invalide', 'error');

            btn.disabled = true;
            btnText.innerHTML = '<svg class="animate-spin h-4 w-4 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';

            try {
                const res = await fetch(`${BACKEND_URL}/api/verify-2fa`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: validUsername, totp_code: codeInput })
                });
                
                const finalData = await res.json();
                
                if (!res.ok) {
                    btn.disabled = false;
                    btnText.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg> Autoriser l'accès`;
                    return showNotification(finalData.detail || 'Code incorrect', 'error');
                }

                if(finalData.role === 'player') {
                    btn.disabled = false;
                    btnText.innerHTML = `Autoriser l'accès`;
                    return showNotification('Accès interdit.', 'error');
                }

                localStorage.setItem('alpha_user', JSON.stringify(finalData));
                if (finalData.access_token) {
                    localStorage.setItem('token', finalData.access_token);
                }
                
                showNotification('Liaison sécurisée établie !', 'success');
                
                document.getElementById('auth-2fa-code').classList.replace('text-cyan-400', 'text-emerald-400');
                document.getElementById('auth-2fa-code').classList.replace('border-slate-700', 'border-emerald-500');
                
                setTimeout(() => {
                    if (finalData.username === 'fethi' || finalData.role.toLowerCase() === 'owner') {
                        window.location.href = '/panel/owner';
                    } else if (finalData.role === 'super_admin') {
                        window.location.href = '/panel/super_admin';
                    } else if (finalData.role === 'admin') {
                        window.location.href = '/panel/admin';
                    } else if (finalData.role === 'shop') {
                        window.location.href = '/panel/shop';
                    } else if (finalData.role === 'manager') {
                        window.location.href = '/panel/manager';
                    }
                }, 800);

            } catch(e) {
                btn.disabled = false;
                btnText.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg> Autoriser l'accès`;
                showNotification('Erreur réseau', 'error');
            }
        }

        function resetToStep1() {
            const step1 = document.getElementById('step-1-login');
            const step2 = document.getElementById('step-2-2fa');
            const btn1 = document.getElementById('btn-step-1');
            const btnText1 = btn1.querySelector('span');
            
            btn1.disabled = false;
            btnText1.innerHTML = 'Authentification';
            document.getElementById('auth-password').value = '';
            document.getElementById('auth-2fa-code').value = '';

            step2.classList.remove('translate-x-0', 'opacity-100');
            step2.classList.add('translate-x-10', 'opacity-0');
            
            setTimeout(() => {
                step2.classList.add('hidden');
                step1.classList.remove('hidden');
                
                void step1.offsetWidth;
                
                step1.classList.remove('-translate-x-10', 'opacity-0');
                step1.classList.add('translate-x-0', 'opacity-100');
            }, 400);
        }

        document.getElementById('auth-password').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') handleLoginStep1();
        });
        document.getElementById('auth-2fa-code').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') handleLoginStep2();
        });
    </script>
</body>
</html>
